<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Ensures proper scaling on mobile and prevents zooming the whole webpage -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="A lightweight, real-time US weather radar dashboard centered on your location.">
  <title>LiteRadar — Live Local Radar</title>

  <!-- Load MapLibre GL JS Styles and Scripts -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <style>
    /* CSS Reset and strict full-viewport layout */
    *, *::before, *::after { box-sizing: border-box; }
    
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #0f172a; 
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden; 
    }

    #map { position: absolute; top: 0; bottom: 0; width: 100%; }

    /* WCAG-compliant status indicator */
    #status-badge {
      position: absolute; top: 16px; left: 16px; z-index: 10;
      background-color: rgba(0, 0, 0, 0.85); color: #22c55e;
      padding: 10px 16px; border-radius: 6px; font-weight: 600;
      font-size: 0.9rem; letter-spacing: 0.5px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      transition: color 0.3s ease;
    }

    /* Central crosshair to indicate the locked GPS location */
    .crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 24px; height: 24px; pointer-events: none; z-index: 10;
    }
    
    .crosshair::before, .crosshair::after {
      content: ''; position: absolute; background-color: #ffffff;
      box-shadow: 0 0 3px rgba(0,0,0,0.8);
    }
    .crosshair::before { top: 11px; left: 0; width: 24px; height: 2px; }
    .crosshair::after { top: 0; left: 11px; width: 2px; height: 24px; }
  </style>
</head>
<body>

  <!-- Accessible status announcement -->
  <div id="status-badge" role="status" aria-live="polite">Initializing Map...</div>
  
  <div id="map" aria-label="Interactive weather radar map"></div>
  <div class="crosshair" aria-hidden="true"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const statusBadge = document.getElementById('status-badge');

      // 1. Initialize MapLibre Engine
      const map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {
            'osm-tiles': {
              type: 'raster',
              tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
              tileSize: 256,
              attribution: '© OpenStreetMap contributors'
            }
          },
          layers: [
            { id: 'background-layer', type: 'background', paint: { 'background-color': '#0f172a' } },
            { id: 'osm-layer', type: 'raster', source: 'osm-tiles', paint: { 'raster-opacity': 0.6, 'raster-saturation': -1 } }
          ]
        },
        center: [-98.5795, 39.8283], // Default center before GPS lock
        zoom: 4,
        maxZoom: 10,
        minZoom: 3
      });

      // 2. Enforce "Set-and-Forget" Rules
      map.dragPan.disable();
      map.keyboard.disable();
      map.scrollZoom.enable();
      map.boxZoom.enable();
      if (map.touchZoomRotate) {
        map.touchZoomRotate.disableRotation(); 
        map.touchZoomRotate.enable(); // Allow pinch-to-zoom
      }

      // 3. Radar Data Management (Silent 60-second WMS updates)
      const updateRadarLayer = () => {
        const sourceId = 'iowa-mesonet-radar';
        const wmsUrl = `https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/n0r.cgi?SERVICE=WMS&REQUEST=GetMap&FORMAT=image/png&TRANSPARENT=true&VERSION=1.1.1&LAYERS=nexrad-n0r&STYLES=&SRS=EPSG:4326&BBOX=-125,24,-66,50&WIDTH=2048&HEIGHT=1024&ts=${Date.now()}`;

        if (map.getSource(sourceId)) {
          map.getSource(sourceId).updateImage({ url: wmsUrl });
        } else {
          map.addSource(sourceId, {
            type: 'image', url: wmsUrl,
            coordinates: [[-125, 50], [-66, 50], [-66, 24], [-125, 24]]
          });
          map.addLayer({
            id: 'radar-layer', type: 'raster', source: sourceId,
            paint: { 'raster-opacity': 0.75, 'raster-fade-duration': 0 }
          });
        }
      };

      // 4. Geolocation Tracking with Zoom Preservation
      let isFirstLock = true; // State tracker to fix the zoom bug

      const lockToGPS = () => {
        if (!('geolocation' in navigator)) {
          statusBadge.innerText = 'GPS Not Supported';
          statusBadge.style.color = '#ef4444';
          return;
        }

        statusBadge.innerText = 'Acquiring GPS...';

        navigator.geolocation.watchPosition(
          (position) => {
            const { longitude, latitude } = position.coords;
            
            if (isFirstLock) {
              // First time finding user: Fly to location and set initial zoom
              map.easeTo({ center: [longitude, latitude], zoom: 8, duration: 1000 });
              isFirstLock = false;
              statusBadge.innerText = 'Live • GPS Locked';
              statusBadge.style.color = '#22c55e';
            } else {
              // Subsequent micro-updates: Instantly update center without modifying the current zoom level
              map.setCenter([longitude, latitude]);
            }
          },
          (error) => {
            console.warn('Geolocation error:', error);
            statusBadge.innerText = 'GPS Permission Denied';
            statusBadge.style.color = '#f59e0b';
          },
          { enableHighAccuracy: true, maximumAge: 10000, timeout: 10000 }
        );
      };

      // Boot sequence
      map.on('load', () => {
        updateRadarLayer();
        lockToGPS();
        setInterval(updateRadarLayer, 60000);
      });
    });
  </script>
</body>
</html>
