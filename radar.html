<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiteRadar Live</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0f172a; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    .crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 20px; height: 20px; pointer-events: none; z-index: 10;
    }
    .crosshair::before, .crosshair::after { content: ''; position: absolute; background: white; }
    .crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
    .crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
    #status { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.7); color: #22c55e; padding: 10px; border-radius: 5px; font-family: monospace; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="crosshair"></div>
  <div id="status">INITIALIZING...</div>

  <script>
    // 1. Force main thread execution and disable origin checks
    maplibregl.workerCount = 0;
    
    // 2. Initialize map with a dummy transform to bypass document.location access
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'osm': { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256 }
        },
        layers: [
          { id: 'bg', type: 'background', paint: { 'background-color': '#0f172a' } },
          { id: 'osm', type: 'raster', source: 'osm', paint: { 'raster-opacity': 0.5, 'raster-saturation': -1 } }
        ]
      },
      center: [-98, 38],
      zoom: 4,
      transformRequest: (url, resourceType) => {
        return { url: url };
      }
    });

    // 3. Location Tracking
    navigator.geolocation.watchPosition(
      (pos) => {
        map.flyTo({ center: [pos.coords.longitude, pos.coords.latitude], zoom: 7 });
        document.getElementById('status').innerText = "GPS: LOCKED";
      },
      () => { document.getElementById('status').innerText = "GPS: ERROR"; },
      { enableHighAccuracy: true }
    );

    // 4. Radar Polling
    function updateRadar() {
      if (map.getSource('radar')) map.removeLayer('radar'), map.removeSource('radar');
      
      map.addSource('radar', {
        type: 'image',
        url: `https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/n0r.cgi?SERVICE=WMS&REQUEST=GetMap&FORMAT=image/png&TRANSPARENT=true&VERSION=1.1.1&LAYERS=nexrad-n0r&STYLES=&SRS=EPSG:4326&BBOX=-125,24,-66,50&WIDTH=1024&HEIGHT=512&ts=${Date.now()}`,
        coordinates: [[-125, 50], [-66, 50], [-66, 24], [-125, 24]]
      });

      map.addLayer({ id: 'radar', type: 'raster', source: 'radar', paint: { 'raster-opacity': 0.8 } });
    }

    map.on('load', () => {
      updateRadar();
      setInterval(updateRadar, 60000);
    });
  </script>
</body>
</html>
